<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Weigh In">
<meta name="theme-color" content="#0B0911">
<title>Weigh In</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0911; --card:#15111D; --line:#2E2540; --line2:#44375A; --input:#0F0C16;
  --text:#EDE7F5; --muted:#A99BBE; --green:#9BEF6E; --green-t:#1D2A17;
  --orange:#FF9A3C; --orange-l:#FFB877; --orange-t:#2E1A0C; --purple:#C77DFF;
  --sans:'IBM Plex Sans',system-ui,-apple-system,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
  --cond:'Barlow Condensed','Arial Narrow',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background-color:var(--bg);color:var(--text)}
body{
  font:15px/1.4 var(--sans); -webkit-tap-highlight-color:transparent; -webkit-text-size-adjust:100%;
  background-image:linear-gradient(rgba(155,239,110,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(155,239,110,.035) 1px,transparent 1px);
  background-size:24px 24px; background-attachment:fixed; overscroll-behavior-y:none;
}
#view{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 104px);display:flex;flex-direction:column;gap:14px}
.head{display:flex;justify-content:space-between;align-items:flex-end;padding:0 2px 4px;gap:12px}
.eyebrow{font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--orange)}
h1{margin:0;font:700 44px/1.05 var(--cond);text-transform:uppercase;letter-spacing:.02em}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card.warm{background:var(--orange-t);border-color:#4A2C14}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.rowb{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.label{margin:0;font:500 12px var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:13px} .xs{font-size:12px}
p{margin:0}
.big{font:700 44px/1 var(--cond)} .mid{font:700 22px/1.1 var(--cond)}
.tag{font:600 12px var(--sans);padding:3px 9px;border-radius:3px;white-space:nowrap}
.tag.g{color:var(--green);background:var(--green-t)} .tag.o{color:var(--orange-l);background:var(--orange-t)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.btn{min-height:48px;border:0;border-radius:6px;background:var(--green);color:var(--bg);font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 14px;text-decoration:none;width:100%}
.btn.o{background:var(--orange)}
.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--text)}
.btn:disabled{opacity:.4}
.link{min-height:44px;border:0;background:transparent;color:var(--green);font-weight:600;padding:0 4px}
.link.m{color:var(--muted);font-weight:500}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;background:var(--bg);border-radius:6px;padding:4px}
.seg button{min-height:40px;border:0;border-radius:4px;background:transparent;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--text);font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
input[type=text],input[type=number],input[type=date],textarea,input:not([type]){
  width:100%;min-width:0;height:46px;border:1px solid var(--line2);border-radius:4px;padding:0 12px;background:var(--input);color:var(--text);font-size:16px;font-weight:500;
}
input[type=date]{-webkit-appearance:none;appearance:none;display:block}
textarea{height:auto;min-height:110px;padding:10px 12px;font:400 12px/1.5 var(--mono)}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--purple);outline-offset:1px}
.list>div{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:52px;border-bottom:1px solid var(--line)}
.list>div:last-child{border-bottom:0}
.bar{position:relative;height:10px;border-radius:3px;background:var(--bg);overflow:hidden}
.bar>i{position:absolute;top:0;bottom:0;left:0}
.pslide{display:flex;flex-direction:column;gap:6px}
.pval{font:700 22px/1 var(--cond);color:var(--text)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:0;--p:0%}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--purple) var(--p),var(--bg) var(--p));border:1px solid var(--line2)}
input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--purple) var(--p),var(--bg) var(--p));border:1px solid var(--line2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-11px;border-radius:50%;background:var(--text);border:3px solid var(--purple)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--text);border:3px solid var(--purple)}
.presets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.presets button{min-height:54px;border-radius:6px;border:1px solid var(--line2);background:var(--input);font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.presets button span{font-size:12px;font-weight:500;color:var(--green)}
.dose{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.dose div{height:36px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;background:var(--bg);color:var(--muted)}
.dose .done{background:var(--text);color:var(--bg)} .dose .now{border:2px solid var(--green);color:var(--green)}
.wk{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.wk>div{display:flex;flex-direction:column;align-items:center;gap:4px}
.wk span.s{width:100%;height:26px;border-radius:4px;border:1.5px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--muted)}
.wk span.s.on{background:var(--orange);border-color:var(--orange);color:var(--bg)}
.ex.paused{opacity:.45}
.injchips button i{font-style:normal;font-size:12px;font-weight:500;opacity:.75}
.checkin{display:flex;flex-direction:column;gap:8px;border-top:1px solid rgba(255,154,60,.25);padding-top:8px;color:#F3D3B5}
.checkin .btn{min-height:40px}
.pent{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.pent button{min-height:32px;display:flex;align-items:center;gap:6px;padding:0 10px;border-radius:16px;border:1px solid var(--line2);background:var(--input);color:var(--text);font-weight:600;font-size:13px}
.pent button span{font-size:11px;color:var(--muted)}
.wk7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wk7>div{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:4px;background:var(--bg);font-size:11px;color:var(--muted)}
.wk7>div b{font:700 14px var(--cond);color:var(--muted)}
.wk7>div.part b{color:var(--purple)}
.wk7>div.hit{background:var(--green-t)}
.wk7>div.hit b{color:var(--green)}
.wk7>div.now{outline:1px solid var(--line2)}
.srow{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;min-height:56px;padding:8px 0;border:0;border-top:1px solid var(--line);background:transparent;color:var(--text);text-align:left;font:inherit}
.sedit{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.sedrow{display:grid;grid-template-columns:1fr 76px 64px;gap:6px;align-items:center}
.sedrow input{height:40px !important;padding:0 8px !important}
.sedit .btn{min-height:42px}
.sites{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.sites button{min-height:44px;border-radius:6px;border:1px solid var(--line2);background:var(--input);color:var(--text);font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.sites button[aria-pressed="true"]{border-color:var(--green);background:var(--green-t);color:var(--green)}
.sites button span{font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--purple)}
.fx{display:flex;flex-wrap:wrap;gap:6px}
.fx button{min-height:36px;display:flex;align-items:center;gap:6px;padding:0 12px;border-radius:18px;border:1px solid var(--line2);background:var(--input);color:var(--muted);font-weight:600;font-size:13px}
.fx button span{font-size:11px;font-weight:500}
.fx button[data-v="1"]{border-color:var(--purple);color:var(--purple)}
.fx button[data-v="2"]{border-color:var(--orange);color:var(--orange-l);background:var(--orange-t)}
.fx button[data-v="3"]{border-color:var(--orange);background:var(--orange);color:var(--bg)}
.injchips{display:flex;flex-wrap:wrap;gap:6px}
.injchips button{min-height:36px;display:flex;align-items:center;gap:8px;padding:0 10px 0 12px;border-radius:18px;border:1px solid var(--orange);background:var(--orange-t);color:var(--orange-l);font-weight:600;font-size:14px}
.injchips button span{font-size:12px;opacity:.8}
.sel{height:46px;width:100%;border:1px solid var(--line2);border-radius:4px;padding:0 12px;background:var(--input);color:var(--text);font:500 16px var(--sans)}
.ex h3{margin:0;font-size:16px;font-weight:600}
.timer{min-height:46px;border-radius:4px;border:1px solid var(--orange);background:transparent;color:var(--orange);font-weight:600;font-size:14px;align-self:end}
.timer.on{background:var(--orange);color:var(--bg)}
.switch{flex-shrink:0;width:52px;height:32px;border-radius:16px;border:0;padding:3px;display:flex;background:var(--line2)}
.switch[aria-checked="true"]{background:var(--orange);justify-content:flex-end}
.switch i{width:26px;height:26px;border-radius:13px;background:var(--text);display:block}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips button{flex-shrink:0;min-height:36px;padding:0 14px;border-radius:3px;border:1px solid var(--line2);background:var(--card);font-size:13px;font-weight:500}
.chips button[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:var(--bg);font-weight:600}
.check{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;font-size:14px;font-weight:500}
.check input{width:22px;height:22px;accent-color:var(--green)}
svg.chart{display:block;width:100%;height:auto}
.empty{padding:28px 0;text-align:center;color:var(--muted);font-size:14px}
.back{align-self:flex-start;min-height:44px;display:flex;align-items:center;gap:4px;border:0;background:transparent;color:var(--green);font-weight:500;padding:0}
.iconbtn{width:44px;height:44px;flex-shrink:0;border-radius:8px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--text)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);padding:6px 8px env(safe-area-inset-bottom)}
nav .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
nav button{min-height:56px;border:0;background:transparent;color:var(--muted);font-size:11px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:3px;padding-top:4px}
nav button[aria-current="page"]{color:var(--text);font-weight:600}
#ask{position:fixed;inset:0;z-index:20;background:rgba(5,4,8,.7);display:flex;align-items:flex-end;justify-content:center;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px)}
#ask[hidden]{display:none}
#ask .sheet{width:100%;max-width:488px;background:var(--card);border:1px solid var(--line2);border-radius:8px;padding:18px 16px 16px;display:flex;flex-direction:column;gap:16px}
#ask p{margin:0;font-size:16px;font-weight:500;line-height:1.45}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translateX(-50%);background:var(--text);color:var(--bg);font-weight:600;font-size:14px;padding:10px 16px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10;max-width:90vw;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>
<main id="view" aria-live="polite"></main>
<nav aria-label="Main"><div class="in" id="tabs"></div></nav>
<div id="toast" role="status"></div>
<div id="ask" hidden><div class="sheet" role="alertdialog" aria-modal="true" aria-labelledby="askMsg"><p id="askMsg"></p><div class="grid2"><button class="btn ghost" id="askNo">Cancel</button><button class="btn" id="askYes">OK</button></div></div></div>
<script>
'use strict';
/* ---------- constants ---------- */
const KEY = 'weighin.v1';
const DOSES = [0.25, 0.5, 1.0, 1.7, 2.4];
const LIFTS = {
  A: [
    {id:'legpress', name:'Leg press', short:'Leg press', alt:'Smith machine squat if it is taken', sets:3, lo:10, hi:12, rest:120, leg:true},
    {id:'chest', name:'Machine chest press', short:'Chest', alt:'Last set 1 or 2 reps from failure', sets:3, lo:8, hi:12, rest:120},
    {id:'pulldown', name:'Lat pulldown', short:'Pulldown', alt:'Last set 1 or 2 reps from failure', sets:3, lo:8, hi:12, rest:120},
    {id:'legcurl', name:'Seated leg curl', short:'Leg curl', alt:'Control it down', sets:3, lo:10, hi:12, rest:90, leg:true},
    {id:'facepull', name:'Cable face pull', short:'Face pull', alt:'Or rear delt machine', sets:3, lo:15, hi:15, rest:60},
    {id:'abcrunch', name:'Ab crunch machine', short:'Ab crunch', alt:'Or cable crunch', sets:3, lo:12, hi:15, rest:60}
  ],
  B: [
    {id:'smithsquat', name:'Smith machine squat', short:'Squat', alt:'Feet slightly forward, or hack squat', sets:3, lo:8, hi:10, rest:120, leg:true},
    {id:'shoulder', name:'Machine shoulder press', short:'Shoulder', alt:'Last set 1 or 2 reps from failure', sets:3, lo:8, hi:12, rest:120},
    {id:'row', name:'Seated cable row', short:'Row', alt:'Or machine row', sets:3, lo:8, hi:12, rest:120},
    {id:'legext', name:'Leg extension', short:'Leg ext', alt:'Control it down', sets:3, lo:12, hi:12, rest:90, leg:true},
    {id:'arms', name:'Pushdown + preacher curl', short:'Arms', alt:'Superset, log the pushdown · cable curl if no preacher', sets:2, lo:12, hi:12, rest:60, each:true},
    {id:'backext', name:'Back extension', short:'Back ext', alt:'Or Smith machine RDL', sets:3, lo:10, hi:10, rest:90, leg:true}
  ]
};
const ALL = [...LIFTS.A.map(l => ({...l, day:'A'})), ...LIFTS.B.map(l => ({...l, day:'B'}))];
const BYID = Object.fromEntries(ALL.map(l => [l.id, l]));
const COMPOUNDS = ['legpress', 'chest', 'pulldown', 'smithsquat', 'shoulder', 'row'];
// Per injury: lifts to pause outright, and lifts to keep with a modification note.
const INJURIES = {
  ankle:     {label:'Ankle', group:'Lower body',
    pause:['legpress', 'smithsquat', 'legcurl', 'legext', 'backext'], mod:{}},
  knee:      {label:'Knee', group:'Lower body',
    pause:['legpress', 'smithsquat', 'legext'],
    mod:{legcurl:'Light, slow, stop short of where the knee complains', backext:'Soft knees, keep it light'}},
  hip:       {label:'Hip or groin', group:'Lower body',
    pause:['smithsquat', 'legpress'],
    mod:{backext:'Half range, light, no lockout squeeze', legcurl:'Light, keep hips flat on the pad'}},
  hamstring: {label:'Hamstring', group:'Lower body',
    pause:['legcurl', 'backext'],
    mod:{smithsquat:'Lighter and shallower, stop above parallel', legpress:'Feet low on the platform, shorter range'}},
  back:      {label:'Lower back', group:'Lower body',
    pause:['smithsquat', 'backext'],
    mod:{legpress:"Don't let your hips roll off the pad, shorter range", row:'Chest-supported machine row instead', shoulder:'Back flat on the pad, lighter', abcrunch:'Light, or swap for a plank'}},
  shoulder:  {label:'Shoulder', group:'Upper body',
    pause:['shoulder'],
    mod:{chest:"Lighter, neutral handles, don't go deep", pulldown:'Neutral grip, stop short of the top stretch', facepull:'Very light, pain-free range only', row:'Neutral grip, no big stretch forward', arms:'Light, elbows pinned'}},
  elbow:     {label:'Elbow', group:'Upper body',
    pause:['arms'],
    mod:{chest:'Lighter, slow lowering', shoulder:'Lighter, slow lowering', pulldown:'Lighter, use straps', row:'Lighter, use straps', facepull:'Light'}},
  wrist:     {label:'Wrist or hand', group:'Upper body',
    pause:['arms'],
    mod:{chest:'Neutral handles, wrists straight', shoulder:'Neutral handles, wrists straight', pulldown:'Use straps', row:'Use straps', facepull:'Use a rope, light'}},
  neck:      {label:'Neck', group:'Upper body',
    pause:['shoulder'],
    mod:{pulldown:'Pull to the front only, head neutral', facepull:"Light, don't jut your chin", abcrunch:"Don't pull on your head, or swap for a plank"}}
};
const SITES = [['abL', 'Stomach L'], ['abR', 'Stomach R'], ['thL', 'Thigh L'], ['thR', 'Thigh R'], ['arL', 'Arm L'], ['arR', 'Arm R']];
const SITE = Object.fromEntries(SITES);
const EFFECTS = [['nausea', 'Nausea'], ['fatigue', 'Tired'], ['reflux', 'Reflux'], ['constip', 'Constipation'], ['headache', 'Headache'], ['appetite', 'No appetite']];
const SEV = ['', 'mild', 'moderate', 'bad'];
const injuries = () => (Array.isArray(S.settings.injuries) ? S.settings.injuries : []).filter(k => INJURIES[k]);
const injLabels = ks => ks.map(k => INJURIES[k].label.toLowerCase()).join(' and ');
// Combines every active injury: a lift is paused if any injury pauses it, otherwise it collects each injury's note.
const liftPlan = l => { const act = injuries(); if (!act.length) return null; const pausedBy = act.filter(k => INJURIES[k].pause.includes(l.id)), notes = act.filter(k => INJURIES[k].mod[l.id]).map(k => [INJURIES[k].label, INJURIES[k].mod[l.id]]); return pausedBy.length || notes.length ? {pausedBy, notes} : null; };
const injuryOptions = () => { const act = injuries(), left = Object.entries(INJURIES).filter(([k]) => !act.includes(k)); return `<option value="">${act.length ? 'Add another injury' : 'Add an injury'}</option>${['Lower body', 'Upper body'].map(g => { const o = left.filter(([, v]) => v.group === g); return o.length ? `<optgroup label="${g}">${o.map(([k, v]) => `<option value="${k}">${v.label}</option>`).join('')}</optgroup>` : ''; }).join('')}`; };
const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const WDL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MOL = ['January','February','March','April','May','June','July','August','September','October','November','December'];

/* ---------- state ---------- */
function defaults(){
  return {
    v:1, weighins:[], protein:{}, sessions:[], draft:null, injections:[], effects:{},
    presets:[{label:'Shake', g:50}, {label:'Dinner', g:60}, {label:'Snack', g:10}],
    settings:{heightCm:'', wegovyStart:'', injuries:[], injurySince:{}, injuryChecked:{}, proteinLo:130, proteinHi:150, blockStart:'', weighDay:6},
    meta:{lastBackup:'', weightExportedThrough:'', wegovyExportedThrough:''}
  };
}
function merge(s){
  const d = defaults();
  if (s.settings) {
    if (!Array.isArray(s.settings.injuries)) s.settings.injuries = s.settings.injury ? [s.settings.injury] : s.settings.ankle ? ['ankle'] : [];
    delete s.settings.ankle; delete s.settings.injury;
    const since = s.settings.injurySince = s.settings.injurySince || {}, d0 = new Date(), t = `${d0.getFullYear()}-${String(d0.getMonth()+1).padStart(2,'0')}-${String(d0.getDate()).padStart(2,'0')}`;
    for (const k of s.settings.injuries) if (!since[k]) since[k] = t;
  }
  return {...d, ...s, settings:{...d.settings, ...(s.settings||{})}, meta:{...d.meta, ...(s.meta||{})},
    presets: Array.isArray(s.presets) && s.presets.length ? s.presets : d.presets,
    weighins: Array.isArray(s.weighins) ? s.weighins : [], sessions: Array.isArray(s.sessions) ? s.sessions : [],
    protein: s.protein && typeof s.protein === 'object' ? s.protein : {},
    injections: Array.isArray(s.injections) ? s.injections : [], effects: s.effects && typeof s.effects === 'object' ? s.effects : {}};
}
function load(){
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.v === 1) return merge(s); } catch (e) {}
  return defaults();
}
let S = load();
let askedPersist = false;
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('Could not save. Storage is full or blocked.'); }
  if (!askedPersist && navigator.storage && navigator.storage.persist) { askedPersist = true; navigator.storage.persist().catch(() => {}); }
}
const ui = {editSess:null, allSess:false, tab:'today', wtab:'weight', gymDay:null, statLift:null, exTab:'weight', onlyNew:true, pSlide:30};

/* ---------- helpers ---------- */
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const today = () => iso(new Date());
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
const fmt = s => { const d = parse(s); return `${WD[d.getDay()]} ${d.getDate()} ${MO[d.getMonth()]}`; };
const fmtShort = s => { const d = parse(s); return `${d.getDate()} ${MO[d.getMonth()]}`; };
const fmtLong = s => { const d = parse(s); return `${WDL[d.getDay()]} ${d.getDate()} ${MOL[d.getMonth()]}`; };
const num = v => { if (v === '' || v == null) return null; const n = Number(String(v).replace(',', '.')); return isFinite(n) ? n : null; };
const kg1 = n => (Math.round(n * 10) / 10).toFixed(1);
const kgS = n => String(Math.round(n * 100) / 100);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// In-app yes/no sheet instead of the browser's native dialog: works everywhere and matches the app.
function ask(msg, yes = 'OK', danger = false){
  return new Promise(res => {
    const box = document.getElementById('ask'), y = document.getElementById('askYes'), n = document.getElementById('askNo');
    document.getElementById('askMsg').textContent = msg; y.textContent = yes; y.className = 'btn' + (danger ? ' o' : '');
    const done = v => { box.hidden = true; y.onclick = n.onclick = box.onclick = null; document.removeEventListener('keydown', key); res(v); };
    const key = e => { if (e.key === 'Escape') done(false); };
    y.onclick = () => done(true); n.onclick = () => done(false); box.onclick = e => { if (e.target === box) done(false); };

}

/* ---------- domain ---------- */
const weighins = () => [...S.weighins].sort((a, b) => a.date < b.date ? -1 : 1);
const heightM = () => { const h = num(S.settings.heightCm); return h && h > 100 ? h / 100 : null; };
const bmi = kg => { const h = heightM(); return h ? kg / (h * h) : null; };
const healthyTop = () => { const h = heightM(); return h ? 24.9 * h * h : null; };

function doseOn(s){
  const st = S.settings.wegovyStart; if (!st) return null;
  const n = daysBetween(st, s); if (n < 0) return null;
  return DOSES[Math.min(4, Math.floor(n / 28))];
}
function nextInjection(){
  const st = S.settings.wegovyStart; if (!st) return null;
  const t = today(); const n = daysBetween(st, t);
  if (n < 0) return {date:st, num:1, mg:DOSES[0], step:false};
  const date = addDays(t, (7 - (n % 7)) % 7);
  const k = daysBetween(st, date) / 7 + 1;
  const mg = doseOn(date); const prev = k > 1 ? doseOn(addDays(date, -7)) : null;
  return {date, num:k, mg, step: prev !== null && mg > prev};
}
function nextWeighDay(){
  const t = today(); const wd = Number(S.settings.weighDay ?? 6);
  let off = (wd - parse(t).getDay() + 7) % 7;
  if (off === 0 && S.weighins.some(w => w.date === t)) off = 7;
  return addDays(t, off);
}
function insight(ws){
  if (ws.length < 2) return 'Once you have two weigh-ins this will read the trend for you.';
  const n = ws.length, last = ws[n-1], prev = ws[n-2], dw = last.kg - prev.kg;
  if (n >= 4) {
    const l = ws.slice(-4); let stall = true;
    for (let i = 1; i < 4; i++) {
      if (l[i].kg < l[i-1].kg - 0.1) stall = false;
      if (l[i].waist != null && l[i-1].waist != null && l[i].waist < l[i-1].waist) stall = false;
    }
    if (stall) return 'Three weeks with no real drop. Worth a look at portions before assuming the dose is the problem.';
  }
  const dwaist = last.waist != null && prev.waist != null ? last.waist - prev.waist : null;
  if (dw > -0.2 && dwaist != null && dwaist < 0) return `Scale flat but waist down ${kg1(-dwaist)} cm. That's the good kind of plateau, change nothing.`;
  if (dw >= -0.1) return 'Flat or up week. On its own that means nothing: water, a big meal or lifting can all do it.';
  return `Down ${kg1(-dw)} kg on last week.`;
}
function upsertWeigh(w){
  S.weighins = S.weighins.filter(x => x.date !== w.date); S.weighins.push(w);
}
const proteinToday = () => S.protein[today()] || [];

/* trend: trailing average of the last 3 weigh-ins, and kg/week over the last 4 weeks */
const trendLine = ws => ws.map((w, i) => { const sl = ws.slice(Math.max(0, i - 2), i + 1); return sl.reduce((a, b) => a + b.kg, 0) / sl.length; });
function weeklyRate(ws){
  if (ws.length < 2) return null;
  const end = ws[ws.length-1].date, pts = ws.filter(w => daysBetween(w.date, end) <= 28);
  if (pts.length < 2 || daysBetween(pts[0].date, end) < 13) return null;
  const xs = pts.map(w => daysBetween(pts[0].date, w.date)), ys = pts.map(w => w.kg), n = xs.length;
  const mx = xs.reduce((a, b) => a + b, 0) / n, my = ys.reduce((a, b) => a + b, 0) / n;
  const slope = xs.reduce((a, x, i) => a + (x - mx) * (ys[i] - my), 0) / xs.reduce((a, x) => a + (x - mx) ** 2, 0);
  return slope * 7;
}

/* injections and side effects */
const injSorted = () => [...S.injections].sort((a, b) => a.date < b.date ? -1 : 1);
const lastInj = () => { const a = injSorted(); return a[a.length-1] || null; };
const nextSite = () => { const l = lastInj(); if (!l || !SITE[l.site]) return SITES[0][0]; return SITES[(SITES.findIndex(x => x[0] === l.site) + 1) % SITES.length][0]; };
function effectsByDose(){
  const out = {};
  for (const [date, e] of Object.entries(S.effects)) {
    const mg = doseOn(date); if (mg == null) continue;
    const o = out[mg] = out[mg] || {days:0, sym:{}};
    if (Object.values(e).some(v => v > 0)) o.days++;
    for (const [k, v] of Object.entries(e)) if (v > 0) { const x = o.sym[k] = o.sym[k] || {n:0, worst:0}; x.n++; x.worst = Math.max(x.worst, v); }
  }
  return out;
}

/* injury check-ins */
const injSince = k => (S.settings.injurySince || {})[k] || today();
const injDue = k => daysBetween((S.settings.injuryChecked || {})[k] || injSince(k), today()) >= 14;

/* deload: the week after each 6-week block */
const deloadOn = d => { const bs = S.settings.blockStart; if (!bs) return false; const n = daysBetween(bs, d); return n >= 42 && n < 49; };
const deloadKg = kg => Math.max(0, Math.round(kg * 0.6 / 2.5) * 2.5);

/* gym */
const sessionsSorted = () => [...S.sessions].sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
function entries(id){ return sessionsSorted().filter(s => !s.deload && s.sets && s.sets[id]).map(s => ({date:s.date, kg:s.sets[id].kg, reps:s.sets[id].reps})); }
function nextDay(){ const s = sessionsSorted(); return s.length ? (s[s.length-1].day === 'A' ? 'B' : 'A') : 'A'; }
function liftFlag(l){
  const e = entries(l.id); if (!e.length) return null;
  const last = e[e.length-1];
  if (last.reps >= l.hi) return {kind:'up', text:'Top of the range last time. Go up one plate.'};
  if (e.length >= 2 && last.reps < l.lo && e[e.length-2].reps < l.lo) return {kind:'down', text:`Missed reps twice. Drop 10% to about ${kgS(Math.round(last.kg * 0.9 * 2) / 2)} kg.`};

}
function platesUp(){ let n = 0; for (const l of ALL) { const e = entries(l.id); for (let i = 1; i < e.length; i++) if (e[i].kg > e[i-1].kg) n++; } return n; }
function isStalled(l){
  const e = entries(l.id); if (e.length < 2) return false;
  let since = e[0].date;
  for (let i = 1; i < e.length; i++) if (e[i].kg > e[i-1].kg) since = e[i].date;
  return daysBetween(since, e[e.length-1].date) >= 21;
}
const isPaused = l => { const p = liftPlan(l); return !!(p && p.pausedBy.length); };
function blockSessions(){
  const bs = S.settings.blockStart; if (!bs) return [];

/* ---------- audio for rest timer ---------- */
let actx = null;
function ensureAudio(){ try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) {} }
function beep(){
  if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
  if (!actx) return;
  [0, 0.35].forEach(t => {
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = 880; o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(0.0001, actx.currentTime + t); g.gain.exponentialRampToValueAtTime(0.3, actx.currentTime + t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + t + 0.25);
    o.start(actx.currentTime + t); o.stop(actx.currentTime + t + 0.3);
  });
}
let timer = null;
function updateTimers(){

/* ---------- chart ---------- */
function chart(points, color, aria, trend){
  if (!points.length) return '<div class="empty">Nothing to chart yet.</div>';
  const L = 34, R = 344, T = 24, B = 136;
  const vs = points.map(p => p.v).concat(trend || []);
  let lo = Math.min(...vs), hi = Math.max(...vs);
  if (hi - lo < 2) { const m = (hi + lo) / 2; lo = m - 1; hi = m + 1; }
  const pv = (hi - lo) * 0.15; lo -= pv; hi += pv;
  const n = points.length;
  const x = i => n === 1 ? (L + R) / 2 : L + 12 + i * ((R - L - 24) / (n - 1));
  const y = v => T + (hi - v) / (hi - lo) * (B - T);
  const ticks = [hi - pv, (hi + lo) / 2, lo + pv];
  let s = `<svg class="chart" viewBox="0 0 354 160" role="img" aria-label="${esc(aria)}">`;
  s += ticks.map(t => `<path d="M${L} ${y(t).toFixed(1)}H${R}" stroke="#2E2540"/><text x="0" y="${(y(t) + 3).toFixed(1)}" font-size="10" fill="#A99BBE" font-family="IBM Plex Sans">${Math.round(t)}</text>`).join('');
  if (trend && n > 2) s += `<path d="${trend.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join('')}" fill="none" stroke="#EDE7F5" stroke-opacity=".55" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round"/>`;
  if (n > 1) s += `<path${trend && n > 2 ? ' stroke-opacity=".45"' : ''} d="${points.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.v).toFixed(1)).join('')}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>`;
  points.forEach((p, i) => {
    s += `<circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="${i === n - 1 ? 5.5 : 4.5}" fill="${color}"/>`;
    if (n <= 8 || i === n - 1 || i === 0) s += `<text x="${x(i).toFixed(1)}" y="${(y(p.v) - 10).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="600" fill="#EDE7F5" font-family="IBM Plex Sans">${esc(p.lbl)}</text>`;
    const showX = n <= 6 || i === 0 || i === n - 1 || i === Math.floor((n - 1) / 2);
    if (showX) s += `<text x="${x(i).toFixed(1)}" y="154" text-anchor="middle" font-size="10" fill="#A99BBE" font-family="IBM Plex Sans">${esc(p.x)}</text>`;
  });
  return s + '</svg>';
}

/* ---------- Wegovy log for Obsidian ---------- */
function wegovyRows(onlyNew){
  const days = new Set([...S.injections.map(x => x.date), ...Object.keys(S.effects)]);
  let ds = [...days].sort();
  if (onlyNew && S.meta.wegovyExportedThrough) ds = ds.filter(d => d > S.meta.wegovyExportedThrough);
  const rows = ds.map(d => {
    const inj = S.injections.find(x => x.date === d), fx = S.effects[d] || {};
    const sym = EFFECTS.filter(([k]) => fx[k]).map(([k, lab]) => `${lab} (${SEV[fx[k]]})`).join(', ');
    return `| ${d} ${WD[parse(d).getDay()]} | ${doseOn(d) ?? ''} | ${inj ? SITE[inj.site] || inj.site : ''} | ${sym} |`;
  });
  if (!rows.length) return '';
  return (onlyNew && S.meta.wegovyExportedThrough ? '' : '| Date | Dose (mg) | Injection site | Side effects |\n| --- | --- | --- | --- |\n') + rows.join('\n');
}

function weightRows(onlyNew){
  let ws = weighins();
  if (onlyNew && S.meta.weightExportedThrough) ws = ws.filter(w => w.date > S.meta.weightExportedThrough);
  return ws.map(w => `| ${w.date} ${WD[parse(w.date).getDay()]} | ${kg1(w.kg)} | ${w.waist != null ? kg1(w.waist) : ''} | ${w.dose ?? ''} | ${String(w.notes || '').replace(/\|/g, '/')} |`).join('\n');
}
function gymTable(){
  const bs = S.settings.blockStart; if (!bs) return '';
  let out = '';
  for (const day of ['A', 'B']) {
    out += `| Workout ${day} | Wk 1 | Wk 2 | Wk 3 | Wk 4 | Wk 5 | Wk 6 |\n| --- | --- | --- | --- | --- | --- | --- |\n`;
    for (const l of LIFTS[day]) {
      const cells = [];
      for (let w = 0; w < 6; w++) {
        const from = addDays(bs, w * 7), to = addDays(bs, w * 7 + 7); let best = null;
        for (const s of S.sessions) { const v = s.sets && s.sets[l.id]; if (s.date >= from && s.date < to && v && (!best || v.kg > best.kg || (v.kg === best.kg && v.reps > best.reps))) best = v; }
        cells.push(best ? `${kgS(best.kg)}x${best.reps}` : '');
      }
      out += `| ${l.name} | ${cells.join(' | ')} |\n`;
    }
    out += '\n';
  }
  return out.trim();
}
const csvCell = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
const weightCsv = () => ['date,weight_kg,waist_cm,dose_mg,notes', ...weighins().map(w => [w.date, w.kg, w.waist ?? '', w.dose ?? '', w.notes || ''].map(csvCell).join(','))].join('\n');
const gymCsv = () => ['date,workout,lift,kg,best_reps', ...sessionsSorted().flatMap(s => Object.entries(s.sets).map(([id, v]) => [s.date, s.day, BYID[id] ? BYID[id].name : id, v.kg, v.reps].map(csvCell).join(',')))].join('\n');

function pageSettings(){
  const ex = ui.exTab, isW = ex === 'weight', isG = ex === 'gym', hasNew = !isG;
  const md = isW ? weightRows(ui.onlyNew) : isG ? gymTable() : wegovyRows(ui.onlyNew);
  let h = `<button class="back" data-act="go" data-to="today">${IC.back}Today</button>` + head('Data stays on this phone', 'Settings');
  h += `<section class="card"><div><h2 class="label">Copy to Obsidian</h2><p class="small muted" style="margin-top:4px">Same columns as your vault logs.</p></div>
    <div class="seg" role="group" aria-label="Log"><button data-act="extab" data-v="weight" aria-pressed="${isW}">Weight</button><button data-act="extab" data-v="gym" aria-pressed="${isG}">Gym</button><button data-act="extab" data-v="wegovy" aria-pressed="${ex === 'wegovy'}">Wegovy</button></div>
    <textarea id="mdOut" readonly aria-label="Markdown to copy" rows="6">${esc(md || (isG ? 'No sessions yet.' : 'Nothing new since your last copy.'))}</textarea>
    ${hasNew ? `<label class="check">Only rows since last copy<input type="checkbox" data-act="onlynew"${ui.onlyNew ? ' checked' : ''}></label>` : ''}
    <button class="btn" data-act="copy"${md ? '' : ' disabled'}>${isW ? 'Copy Weight Log rows' : isG ? 'Copy Gym Log table' : 'Copy Wegovy Log rows'}</button>${ex === 'wegovy' ? '<p class="xs muted">One row per day with an injection or side effects. The first copy includes the table header.</p>' : ''}</section>`;
  h += `<section class="card"><div><h2 class="label">Spreadsheet files</h2><p class="small muted" style="margin-top:4px">Opens the share sheet: Save to Files, email, AirDrop.</p></div><div class="grid2"><button class="btn ghost" data-act="csvw">${IC.share}weight.csv</button><button class="btn ghost" data-act="csvg">${IC.share}gym.csv</button></div></section>`;
  h += `<section class="card"><div class="rowb"><h2 class="label">Full backup</h2><span class="tag ${S.meta.lastBackup ? 'g' : 'o'}">${S.meta.lastBackup ? 'Last ' + fmt(S.meta.lastBackup) : 'Never backed up'}</span></div>
    <p class="small muted">One file with every weigh-in, session and setting. Restore it if you delete the app, change phones, or move it to a new web address.</p>
    <button class="btn" data-act="backup">Back up now (.json)</button>
    <label class="btn ghost" style="cursor:pointer">Restore from backup…<input type="file" id="restore" accept="application/json,.json" style="display:none"></label></section>`;
  const st = S.settings;
  h += `<section class="card"><h2 class="label">You</h2><div class="grid2"><label class="f">Height (cm)<input type="text" inputmode="numeric" data-set="heightCm" value="${esc(st.heightCm)}" placeholder="170"></label><label class="f">Wegovy start<input type="date" data-set="wegovyStart" value="${esc(st.wegovyStart)}"></label></div>
    <div class="grid2"><label class="f">Protein from (g)<input type="text" inputmode="numeric" data-set="proteinLo" value="${esc(st.proteinLo)}"></label><label class="f">Protein to (g)<input type="text" inputmode="numeric" data-set="proteinHi" value="${esc(st.proteinHi)}"></label></div>
    <label class="f">Weigh-in day<select data-set="weighDay" style="height:46px;border:1px solid var(--line2);border-radius:4px;padding:0 12px;background:var(--input);color:var(--text);font-size:16px">${WDL.map((d, i) => `<option value="${i}"${Number(st.weighDay) === i ? ' selected' : ''}>${d}</option>`).join('')}</select></label></section>`;
  h += `<section class="card"><h2 class="label">Import Weight Log</h2><p class="small muted">Paste the table from your Weight Log note. Rows without a weight are skipped, dates already here get replaced.</p><textarea id="imp" placeholder="| 2026-09-19 Sat | 111.2 | 128.0 | 0.25 | … |"></textarea><button class="btn ghost" data-act="import">Import rows</button></section>`;
  h += `<p class="xs muted" style="padding:0 2px">Weigh In keeps everything in this browser's storage on this phone. Nothing is sent anywhere.</p>`;
  return h;
}

/* ---------- render ---------- */
const PAGES = {today:pageToday, weight:pageWeight, gym:pageGym, stats:pageStats, settings:pageSettings};
function render(keepScroll){
  const y = window.scrollY;
  document.getElementById('view').innerHTML = PAGES[ui.tab]();
  document.getElementById('tabs').innerHTML = ['today', 'weight', 'gym', 'stats'].map(t => `<button data-act="go" data-to="${t}"${ui.tab === t ? ' aria-current="page"' : ''}>${IC[t]}${t[0].toUpperCase() + t.slice(1)}</button>`).join('');
  window.scrollTo(0, keepScroll ? y : 0);
  const ps = document.getElementById('pslide'); if (ps) paintSlide(ps);
  updateTimers();
}
function paintSlide(el){ el.style.setProperty('--p', ((el.value - el.min) / (el.max - el.min) * 100) + '%'); }

/* ---------- file out ---------- */
async function shareFile(name, text, type){
  const file = new File([text], name, {type});
  if (navigator.canShare && navigator.canShare({files:[file]})) {
    try { await navigator.share({files:[file], title:name}); return true; }
    catch (e) { if (e && e.name === 'AbortError') return false; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  return true;
}
function importLog(text){
  let n = 0;
  for (const line of String(text).split(/\r?\n/)) {
    const m = line.match(/^\s*\|\s*(\d{4}-\d{2}-\d{2})[^|]*\|\s*([\d.,]+)?\s*\|\s*([\d.,]+)?\s*\|\s*([\d.,]+)?\s*\|([^|]*)\|?/);
    if (!m || !m[2]) continue;
    const kg = num(m[2]); if (kg == null) continue;
    upsertWeigh({date:m[1], kg, waist:num(m[3]), dose:num(m[4]), notes:(m[5] || '').trim()}); n++;
  }
  return n;
}

/* ---------- actions ---------- */
const A = {
  go(el){ ui.tab = el.dataset.to; render(); },
  padd(){ const g = Number(ui.pSlide) || 0; if (g <= 0) return; const t = today(); (S.protein[t] = S.protein[t] || []).push(g); save(); toast('Added ' + g + ' g'); render(true); },
  injsore(el){ S.settings.injuryChecked = {...(S.settings.injuryChecked || {}), [el.dataset.k]: today()}; save(); render(true); toast('Checking again in 2 weeks'); },
  async skipdeload(){ if (!await ask('Skip the deload and start a new 6-week block today?', 'Start new block')) return; ui.gymDay = null; S.settings.blockStart = today(); save(); render(true); },
  site(el){ ui.site = el.dataset.k; render(true); },
  injlog(){ const site = ui.site || nextSite(), t = today(); S.injections = S.injections.filter(x => x.date !== t); S.injections.push({date:t, site}); ui.site = null; save(); toast('Logged · ' + SITE[site]); render(true); },
  async injundo(){ const l = lastInj(); if (!l || !await ask(`Remove the injection logged ${fmt(l.date)}?`, 'Remove', true)) return; S.injections = S.injections.filter(x => x !== l); save(); render(true); },
  fx(el){ const t = today(), k = el.dataset.k, v = ((Number(el.dataset.v) || 0) + 1) % 4; const e = S.effects[t] = {...(S.effects[t] || {})}; if (v) e[k] = v; else delete e[k]; if (!Object.keys(e).length) delete S.effects[t]; save(); render(true); },
  pdel(el){ const t = today(), i = Number(el.dataset.i), a = S.protein[t] || []; if (i < 0 || i >= a.length) return; a.splice(i, 1); if (!a.length) delete S.protein[t]; save(); render(true); },
  injdel(el){ S.settings.injuries = injuries().filter(k => k !== el.dataset.k); for (const m of ['injurySince', 'injuryChecked']) if (S.settings[m]) delete S.settings[m][el.dataset.k]; ui.statLift = null; save(); render(true); toast(INJURIES[el.dataset.k].label + ' removed'); },
  injclear(){ S.settings.injuries = []; S.settings.injurySince = {}; S.settings.injuryChecked = {}; ui.statLift = null; save(); render(true); toast('All lifts back on'); },
  pundo(){ const t = today(); if (S.protein[t] && S.protein[t].length) { S.protein[t].pop(); save(); render(true); } },
  wtab(el){ ui.wtab = el.dataset.v; render(true); },
  async wsave(){
    const date = document.getElementById('wDate').value || today();
    const kg = num(document.getElementById('wKg').value), waist = num(document.getElementById('wWaist').value);
    const notes = document.getElementById('wNotes').value.trim();
    if (kg == null || kg < 30 || kg > 350) { toast('Enter a weight in kg'); return; }
    if (waist != null && (waist < 40 || waist > 250)) { toast('That waist looks off, check the cm'); return; }
    const exists = S.weighins.some(w => w.date === date);
    if (exists && !await ask(`Replace the weigh-in for ${fmt(date)}?`, 'Replace')) return;
    upsertWeigh({date, kg, waist, dose:doseOn(date), notes}); save(); toast('Weigh-in saved'); render(true);
  },
  async wdel(el){ const d = el.dataset.date; if (!await ask(`Delete the weigh-in for ${fmt(d)}?`, 'Delete', true)) return; S.weighins = S.weighins.filter(w => w.date !== d); save(); render(true); },
  gday(el){ ui.gymDay = el.dataset.day; timer = null; if (ui.tab !== 'gym') { ui.tab = 'gym'; render(); } else render(true); },
  timer(el){ ensureAudio(); const id = el.dataset.id; timer = timer && timer.id === id ? null : {id, end:Date.now() + Number(el.dataset.rest) * 1000}; updateTimers(); },
  finish(){
    const d = S.draft;
    const sets = {};
    if (d) for (const [id, v] of Object.entries(d.sets)) if (v && v.kg != null && v.reps != null && v.kg > 0 && v.reps > 0) sets[id] = {kg:v.kg, reps:Math.round(v.reps)};
    if (!Object.keys(sets).length) { toast('Enter kg and reps for at least one lift first'); return; }
    S.sessions = S.sessions.filter(x => !(x.date === d.date && x.day === d.day));
    const bs0 = S.settings.blockStart;
    if (!bs0 || daysBetween(bs0, d.date) >= 49) S.settings.blockStart = d.date;
    S.sessions.push(deloadOn(d.date) ? {date:d.date, day:d.day, sets, deload:true} : {date:d.date, day:d.day, sets});
    S.draft = null; ui.gymDay = null; timer = null; save(); toast(`Workout ${d.day} saved`); render();
  },
  async discard(){ if (!await ask('Discard the workout in progress?', 'Discard', true)) return; S.draft = null; save(); render(true); },
  sessedit(el){ ui.editSess = el.dataset.k; render(true); },
  sesscancel(){ ui.editSess = null; render(true); },
  allsess(){ ui.allSess = !ui.allSess; render(true); },
  async sessdel(){
    const s = S.sessions.find(x => sessKey(x) === ui.editSess); if (!s) return;
    if (!await ask(`Delete Workout ${s.day} from ${fmt(s.date)}? Its lifts come off your charts and progress flags.`, 'Delete', true)) return;
    S.sessions = S.sessions.filter(x => x !== s); ui.editSess = null; save(); toast('Session deleted'); render(true);
  },
  async sesssave(){
    const s = S.sessions.find(x => sessKey(x) === ui.editSess); if (!s) return;
    const date = document.getElementById('edDate').value || s.date, sets = {};
    for (const l of LIFTS[s.day]) {
      const kg = num(document.querySelector(`[data-elift="${l.id}"][data-ef="kg"]`).value), reps = num(document.querySelector(`[data-elift="${l.id}"][data-ef="reps"]`).value);
      if (kg == null && reps == null) continue;
      if (kg == null || reps == null || kg <= 0 || reps <= 0 || kg > 500 || reps > 100) { toast(`${l.short} needs both kg and reps`); return; }
      sets[l.id] = {kg, reps:Math.round(reps)};
    }
    if (!Object.keys(sets).length) { toast('No lifts left. Use Delete instead.'); return; }
    if (date !== s.date && S.sessions.some(x => x !== s && x.date === date && x.day === s.day)) { toast(`There's already a Workout ${s.day} on ${fmt(date)}`); return; }
    s.date = date; s.sets = sets; if (deloadOn(date)) s.deload = true; else delete s.deload;
    ui.editSess = null; save(); toast('Session updated'); render(true);
  },
  slift(el){ ui.statLift = el.dataset.id; render(true); },
  async newblock(){ if (!await ask('Start a new 6-week block from today?', 'Start new block')) return; S.settings.blockStart = today(); save(); render(true); },
  extab(el){ ui.exTab = el.dataset.v; render(true); },
  onlynew(el){ ui.onlyNew = el.checked; render(true); },
  async copy(){
    const ta = document.getElementById('mdOut'), text = ta.value; let ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; }
    catch (e) { ta.removeAttribute('readonly'); ta.select(); ta.setSelectionRange(0, text.length); try { ok = document.execCommand('copy'); } catch (e2) {} ta.setAttribute('readonly', ''); }
    if (!ok) { toast('Copy blocked. Select the text and copy it manually.'); return; }
    if (ui.exTab === 'weight') { const ws = weighins(); if (ws.length) S.meta.weightExportedThrough = ws[ws.length-1].date; save(); }
    if (ui.exTab === 'wegovy') { const ds = [...S.injections.map(x => x.date), ...Object.keys(S.effects)].sort(); if (ds.length) S.meta.wegovyExportedThrough = ds[ds.length-1]; save(); }
    toast('Copied. Paste it into the note.');
  },
  async csvw(){ await shareFile('weight.csv', weightCsv(), 'text/csv'); },
  async csvg(){ await shareFile('gym.csv', gymCsv(), 'text/csv'); },
  async backup(){
    const data = JSON.stringify({...S, exportedAt:new Date().toISOString()}, null, 2);
    const ok = await shareFile(`weigh-in-backup-${today()}.json`, data, 'application/json');
    if (ok) { S.meta.lastBackup = today(); save(); toast('Backup made'); render(true); }
  },
  import(){
    const n = importLog(document.getElementById('imp').value);
    if (!n) { toast('No rows with a date and weight found'); return; }
    save(); toast(`Imported ${n} weigh-in${n === 1 ? '' : 's'}`); render(true);
  }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = A[el.dataset.act];
  if (fn && el.type !== 'checkbox') { e.preventDefault(); fn(el); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.act === 'onlynew') return A.onlynew(el);
  if (el.id === 'injury') { if (!INJURIES[el.value]) return; S.settings.injuries = [...injuries().filter(k => k !== el.value), el.value]; S.settings.injurySince = {...(S.settings.injurySince || {}), [el.value]: today()}; S.settings.injuryChecked = {...(S.settings.injuryChecked || {}), [el.value]: today()}; ui.statLift = null; save(); render(true); toast(INJURIES[el.value].label + ' injury added'); return; }
  if (el.dataset.set) {
    const k = el.dataset.set;
    S.settings[k] = k === 'weighDay' ? Number(el.value) : (k === 'proteinLo' || k === 'proteinHi') ? (num(el.value) || defaults().settings[k]) : el.value.trim();
    save(); return;
  }
  if (el.dataset.preset != null) {
    const p = S.presets[Number(el.dataset.preset)]; if (!p) return;
    if (el.dataset.pf === 'g') p.g = Math.max(0, Math.round(num(el.value) || 0)); else p.label = el.value.trim() || p.label;
    save(); return;
  }
  if (el.id === 'restore' && el.files && el.files[0]) {
    el.files[0].text().then(async txt => {
      let d; try { d = JSON.parse(txt); } catch (err) { toast('That file is not a Weigh In backup'); return; }
      if (!d || d.v !== 1 || !Array.isArray(d.weighins)) { toast('That file is not a Weigh In backup'); return; }
      if (!await ask(`Replace everything on this phone with this backup? It has ${d.weighins.length} weigh-ins and ${(d.sessions || []).length} sessions.`, 'Replace everything', true)) { el.value = ''; return; }
      delete d.exportedAt; S = merge(d); save(); toast('Backup restored'); ui.tab = 'today'; render();
    });
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'pslide') { ui.pSlide = Number(el.value); document.getElementById('pslideV').textContent = ui.pSlide + ' g'; document.getElementById('paddBtn').textContent = 'Add ' + ui.pSlide + ' g'; paintSlide(el); return; }
  if (!el.dataset.lift) return;
  if (!S.draft || S.draft.day !== ui.gymDay) S.draft = {date:today(), day:ui.gymDay, sets:{}};
  const s = S.draft.sets[el.dataset.lift] = S.draft.sets[el.dataset.lift] || {};
  s[el.dataset.field] = num(el.value);
  save();
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && ui.tab === 'today') render(true); });

render();
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
